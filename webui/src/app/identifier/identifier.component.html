<div class="flex align-items-center flex-wrap" [ngClass]="styleClass">
    <!-- Optional link. -->
    @if (link.length !== 0) {
        <a routerLink="{{ link }}">
            <ng-container *ngTemplateOutlet="identifierTemplate"></ng-container>
        </a>
    } @else {
        <ng-container *ngTemplateOutlet="identifierTemplate"></ng-container>
    }
    <ng-template #identifierTemplate>
        <!-- This wrapper with "block" display property ensures the identifier
             (and optional label) are copy in expected format (without any
             extra spaces). -->
        <div class="block">
            @if (label) {
                <span>{{ label }}=</span>
                <span>(</span>
            }
            <!-- Hex format. -->
            @if (hexFormat) {
                <span>{{ hexValue }}</span>
            } @else {
                @for (byte of hexBytes; track byte) {
                    <app-byte-character [byteValue]="byte"></app-byte-character>
                }
            }
            <!-- Empty placeholder. -->
            @if (isEmpty) {
                <span class="font-italic text-color-secondary">Empty identifier</span>
            }
            @if (label) {
                <span>)</span>
            }
        </div>
    </ng-template>
    <p-toggleButton
        onLabel="text"
        offLabel="hex"
        class="ml-1"
        [disabled]="isEmpty"
        [(ngModel)]="hexFormat"
        ngDefaultControl
    >
    </p-toggleButton>
</div>
