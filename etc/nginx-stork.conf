upstream ui_rest {
    server localhost:8080;
}

server {
    listen       80;
    server_name  localhost;
    root   /usr/share/stork/www;
    index  index.html;

    # HTTP Security Headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains";
    add_header Content-Security-Policy "frame-ancestors 'none';";

    location /api {
        proxy_pass http://ui_rest;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        # Stork backend is using Go built-in CrossOriginProtection which
        # mainly relies on the browser-sent Sec-Fetch-Site header,
        # but for older browsers falls back to comparing the Origin
        # header host:port against this Host header.
        # Use $http_host here and in following locations to send host:port
        # in the Host header.
        proxy_set_header Host $http_host;
    }

    location /oidc {
        proxy_pass http://ui_rest;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $http_host;
    }

    location /swagger.json {
        proxy_pass http://ui_rest;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $http_host;
    }

    location /stork-install-agent.sh {
        proxy_pass http://ui_rest;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $http_host;
    }

    location /metrics {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://ui_rest;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $http_host;
    }

    location /sse {
        proxy_pass http://ui_rest;
        # tips from here: https://serverfault.com/questions/801628/for-server-sent-events-sse-what-nginx-proxy-configuration-is-appropriate
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
